name: tts-sample
on:
  push:
    paths: ['tts-test/**']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts
      - run: |
          T="Binance just got hit. Here is what actually happened, and what you should do right now. Never share your two F A codes with anyone."
          edge-tts --voice en-US-AndrewNeural --text "$T" --write-media andrew.mp3
          edge-tts --voice en-US-GuyNeural --text "$T" --write-media guy.mp3
          edge-tts --voice en-US-BrianNeural --text "$T" --write-media brian.mp3
          edge-tts --voice en-US-ChristopherNeural --text "$T" --write-media christopher.mp3
      - run: gh release create tts-sample-${{ github.run_id }} *.mp3 --title tts-sample --notes samples
        env:
          GH_TOKEN: ${{ github.token }}
