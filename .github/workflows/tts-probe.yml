name: tts-probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -U edge-tts && pip list 2>/dev/null | grep -i edge
      - run: |
          for r in "" "--rate=+10%" "--rate=+20%" "--rate=+30%"; do
            edge-tts --voice en-US-AndrewNeural $r --text "Testing the voice." --write-media t.mp3 >/dev/null 2>&1 && echo "OK [$r] $(stat -c%s t.mp3)" || echo "FAIL [$r]"
          done
          for v in en-US-BrianNeural en-US-GuyNeural en-GB-RyanNeural; do
            edge-tts --voice $v --text "Testing the voice." --write-media t.mp3 >/dev/null 2>&1 && echo "OK $v" || echo "FAIL $v"
          done
